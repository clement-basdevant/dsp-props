name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Mutation score
        run: python mutants/run_mutants.py
      - name: Command line
        run: dsp-props check examples/filters.py:fft examples/filters.py:lowpass examples/filters.py:resample_2_3 --derandomize
      - name: Package builds
        run: python -m build && python -m twine check dist/*

  calibration-macos:
    # long double is float64 on macOS arm64: dp.calibrate must use its double-double reference
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" mpmath
      - run: python -c "from dsp_props.core import longdouble_fft_is_extended as e; assert not e()"
      - run: python -m pytest -q tests/test_calibration.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]" && mkdocs build --strict
